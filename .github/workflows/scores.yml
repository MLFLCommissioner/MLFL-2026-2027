# Saves NFL final scores into data.json about every 10 minutes.
# It only does anything while a game is on or has just finished; the rest of the time each run ends in a few seconds.
name: Update final scores

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: final-scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look up final scores
        run: node scripts/update-scores.mjs
      - name: Save them
        run: |
          if git diff --quiet -- data.json; then echo "No new final scores."; exit 0; fi
          git config user.name "MLFL score robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update final scores"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            # The commissioner saved in the meantime: start again from their version.
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node scripts/update-scores.mjs
            if git diff --quiet -- data.json; then exit 0; fi
            git add data.json
            git commit -m "Update final scores"
          done
          exit 1
