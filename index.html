<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLFL Pick'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* Hall of Fame: a single regal world (midnight, oxblood and gold), the same in light and dark. */
.hof{--hof-bg:#0b0a12;--hof-wine:#3a0d18;--hof-gold:#d9b45a;--hof-gold-hi:#f6e3a1;--hof-gold-lo:#8a6a24;--hof-ivory:#f4ead3;--hof-dim:#b9a98a;
  --hof-display:"Cinzel","Trajan Pro",Georgia,serif;--hof-serif:"Cormorant Garamond",Garamond,Georgia,serif;
  color:var(--hof-ivory);font-family:var(--hof-serif);font-size:1.12rem;display:flex;flex-direction:column;gap:28px;padding:8px 0 24px}
body.hof-on{background:radial-gradient(ellipse at top,#2a0c16 0%,#0b0a12 55%) fixed,#0b0a12;color-scheme:dark}
body.hof-on main{padding-top:28px}
.hof .gold{background:linear-gradient(180deg,var(--hof-gold-hi) 0%,var(--hof-gold) 45%,var(--hof-gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hof-crest{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.hof-crest svg{width:74px;height:auto;filter:drop-shadow(0 2px 6px rgba(217,180,90,.35))}
.hof-crest h2{font-family:var(--hof-display);font-weight:900;font-size:clamp(2.1rem,6vw,3.6rem);letter-spacing:.12em;line-height:1.05}
.hof-crest .tag{font-style:italic;color:var(--hof-dim);font-size:1.2rem}
.hof-rule{display:flex;align-items:center;gap:12px;color:var(--hof-gold);font-family:var(--hof-display);letter-spacing:.3em;font-size:.82rem;text-transform:uppercase;justify-content:center}
.hof-rule::before,.hof-rule::after{content:"";height:1px;flex:1;max-width:260px;background:linear-gradient(90deg,transparent,var(--hof-gold),transparent)}
.hof-sound{position:fixed;right:16px;bottom:16px;z-index:15;width:44px;height:44px;border-radius:50%;border:1px solid #d9b45a;background:rgba(11,10,18,.85);color:#f6e3a1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:0}
.hof-sound svg{width:22px;height:22px}
.hof-sound:hover{background:rgba(58,13,24,.95)}
.hof-champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.hof-plaque{position:relative;text-align:center;padding:22px 14px 18px;border:1px solid var(--hof-gold-lo);border-radius:6px;background:linear-gradient(180deg,rgba(58,13,24,.9),rgba(11,10,18,.95));box-shadow:inset 0 0 0 4px rgba(11,10,18,.9),inset 0 0 0 5px rgba(217,180,90,.35),0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:4px;align-items:center}
.hof-plaque .yr{font-family:var(--hof-display);letter-spacing:.18em;font-size:.82rem;color:var(--hof-dim)}
.hof-plaque .nm{font-family:var(--hof-display);font-weight:700;font-size:1.7rem;letter-spacing:.06em}
.hof-plaque .pts{font-style:italic;color:var(--hof-dim)}
.hof-plaque.live{border-style:dashed;background:rgba(11,10,18,.7)}
.hof-plaque svg{width:34px;height:auto}
.hof-group{display:flex;flex-direction:column;gap:12px}
.hof-sub{font-family:var(--hof-display);font-weight:700;font-size:1.25rem;letter-spacing:.1em;text-align:center;margin:0}
.hof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.hof-rec{border-top:2px solid var(--hof-gold);background:rgba(244,234,211,.04);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.hof-rec .k{font-family:var(--hof-display);letter-spacing:.14em;font-size:.74rem;text-transform:uppercase;color:var(--hof-gold)}
.hof-rec .v{font-family:var(--hof-display);font-weight:700;font-size:1.9rem;line-height:1.1}
.hof-rec .w{font-size:1.15rem;font-weight:600}
.hof-rec .d{font-style:italic;color:var(--hof-dim);font-size:1rem}
.hof table{color:var(--hof-ivory);font-family:var(--hof-serif);font-size:1.08rem}
.hof th{color:var(--hof-gold);font-family:var(--hof-display);font-size:.72rem;letter-spacing:.14em}
.hof td,.hof th{border-bottom:1px solid rgba(217,180,90,.22)}
.hof .tw{border:1px solid var(--hof-gold-lo);border-radius:6px;background:rgba(11,10,18,.6)}
.hof .crowns{color:var(--hof-gold);letter-spacing:.1em;white-space:nowrap}
.hof .dim{color:var(--hof-dim)}
.hof-link{color:var(--hof-gold-hi);text-decoration:underline;text-decoration-color:rgba(217,180,90,.5);text-underline-offset:3px}
.hof-link:hover{text-decoration-color:var(--hof-gold-hi)}

.hof-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.hof-member{position:relative;padding:16px 16px 14px;border:1px solid rgba(217,180,90,.3);border-radius:8px;background:rgba(11,10,18,.7);box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.hof-member.won{border-color:var(--hof-gold-lo);background:linear-gradient(160deg,rgba(58,13,24,.92),rgba(11,10,18,.96) 70%);box-shadow:inset 0 0 0 3px rgba(11,10,18,.85),inset 0 0 0 4px rgba(217,180,90,.3),0 10px 30px rgba(0,0,0,.45)}
.hm-top{display:flex;align-items:center;gap:12px}
.hm-rank{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--hof-display);font-weight:700;font-size:.8rem;color:var(--hof-gold);border:1px solid rgba(217,180,90,.5);background:rgba(217,180,90,.06)}
.hof-member.won .hm-rank{color:#1a1206;background:linear-gradient(180deg,var(--hof-gold-hi),var(--hof-gold) 55%,var(--hof-gold-lo));border-color:var(--hof-gold-hi)}
.hm-name{flex:1;min-width:0;font-family:var(--hof-display);font-weight:700;font-size:1.45rem;letter-spacing:.06em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-count{display:flex;flex-direction:column;align-items:center;line-height:1}
.hm-count b{font-family:var(--hof-display);font-weight:900;font-size:2rem}
.hm-count small{font-family:var(--hof-display);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hof-dim);margin-top:2px}
.hm-crowns{display:flex;flex-wrap:wrap;gap:5px}
.hm-yr{display:inline-flex;align-items:center;gap:4px;padding:4px 9px 4px 6px;border-radius:999px;border:1px solid rgba(217,180,90,.45);background:rgba(217,180,90,.08);font-family:var(--hof-display);font-size:.78rem;letter-spacing:.05em;color:var(--hof-gold-hi);white-space:nowrap}
.hm-yr svg{width:15px;height:auto}
.hm-none{font-style:italic;color:var(--hof-dim);font-size:1.05rem}
.hm-stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(217,180,90,.22);padding-top:10px;margin-top:auto}
.hm-s{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.hm-s+.hm-s{border-left:1px solid rgba(217,180,90,.14)}
.hm-s b{font-family:var(--hof-display);font-weight:700;font-size:1.05rem;color:var(--hof-ivory);font-variant-numeric:tabular-nums}
.hm-s span{font-family:var(--hof-display);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hof-dim);white-space:nowrap}
.hm-c{display:block;height:14px;margin-top:3px}.hm-c svg{width:20px;height:auto;filter:drop-shadow(0 1px 3px rgba(217,180,90,.45))}
.hm-s.top b{background:linear-gradient(180deg,var(--hof-gold-hi),var(--hof-gold) 55%,var(--hof-gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.hof .foot{text-align:center;font-style:italic;color:var(--hof-dim);font-size:1rem}
@media (prefers-reduced-motion:no-preference){.hof-plaque{transition:transform .2s ease}.hof-plaque:hover{transform:translateY(-3px)}}
/* Layout idea: a scoreboard. Teal masthead, a wall of game cards that read like the sheet's blocks, results in a right-hand column. */
:root{
  --bg:#eef3f3; --surface:#ffffff; --sunk:#e3eaea; --ink:#0f2022; --muted:#586b6d; --line:#cdd8d8;
  --accent:#0d7f8a; --accent-ink:#ffffff; --board:#10282b; --board-ink:#f1f7f7;
  --gold:#b8860b; --silver:#6f777e; --bronze:#a0592a;
  --pick:#f7bd0a; --pick-ink:#1d1600; --win:#1b9550; --combo:#9447dc; --miss:#d7372b; --res-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1516; --surface:#152123; --sunk:#1c2b2d; --ink:#e7f0f0; --muted:#93a7a9; --line:#2b3d40;
    --accent:#3fc1cc; --accent-ink:#04191b; --board:#050b0c; --board-ink:#e7f0f0;
    --pick:#f2b705; --pick-ink:#1d1600; --win:#27a862; --combo:#a763ea; --miss:#e0483c; --res-ink:#ffffff;
    --gold:#f2c94c; --silver:#c9d0d6; --bronze:#e0995e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1516; --surface:#152123; --sunk:#1c2b2d; --ink:#e7f0f0; --muted:#93a7a9; --line:#2b3d40;
  --accent:#3fc1cc; --accent-ink:#04191b; --board:#050b0c; --board-ink:#e7f0f0;
  --pick:#f2b705; --pick-ink:#1d1600; --win:#27a862; --combo:#a763ea; --miss:#e0483c; --res-ink:#ffffff;
  --gold:#f2c94c; --silver:#c9d0d6; --bronze:#e0995e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.mast{background:var(--accent);color:var(--accent-ink)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-top:14px;padding-bottom:14px}
.mast h1{font-size:2rem;line-height:1;text-transform:uppercase}
.mast .sub{font-weight:600;opacity:.9}
.me{margin-left:auto;font-weight:600;background:rgba(0,0,0,.18);padding:4px 12px;border-radius:999px}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.gate{max-width:560px;margin:8px auto}.gate input[type=password],.gate input#gate-pw{font-size:1.1rem;letter-spacing:.06em}
.pkshow.sm{font-size:1rem;padding:4px 10px}
.byes{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:4px 0 10px}
.bye{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.92rem}.bye .logo{width:22px;height:22px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
h2.grp{font-size:1.5rem;margin:18px 0 0;padding-top:10px;border-top:2px solid var(--line);scroll-margin-top:12px}
h4.sub{font-size:1rem;margin:6px 0 -4px;padding-top:10px;border-top:1px solid var(--line)}
details.fold>summary{background:var(--sunk);padding:8px 12px;font-size:1.2rem;font-weight:700;cursor:pointer;list-style:revert}
details.fold:not([open])>summary{border-bottom:0}
.pkbtns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.err{color:#b3261e;font-weight:600}.pkshow{font:700 1.5rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;padding:10px 14px;background:rgba(0,0,0,.06);border-radius:8px;display:inline-block;user-select:all}
a{color:var(--accent)}
nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:20px 0 56px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.weekhead{font-size:1.9rem;line-height:1.05}
.wkhero{background:linear-gradient(135deg,var(--board) 0%,color-mix(in srgb,var(--board) 78%,var(--accent)) 100%);color:var(--board-ink);border-radius:16px;padding:16px 18px 14px;margin:4px 0 14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.wkhero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wkeyebrow{font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.wkpill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.wkpill.live{background:rgba(229,72,77,.2);color:#ff8a80}.wkpill.fin{background:rgba(80,190,120,.2);color:#7fe0a0}.wkpill.prog{background:rgba(242,201,76,.18);color:#f2c94c}
.wkhero-main{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 10px}
.wkhero .weekhead{font-size:2.6rem;font-weight:900;letter-spacing:-.01em;margin:0;text-align:center;flex:1}
.wkarrow{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:inherit;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.wkarrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.wkarrow:hover:not([disabled]){background:rgba(255,255,255,.14)}.wkarrow[disabled]{opacity:.25;cursor:default}
.wkdays{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.wkday{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 14px 7px;white-space:nowrap}
.wkday b{font-weight:800;text-transform:uppercase;font-size:.72rem;letter-spacing:.14em;color:#f2c94c}
.wkday .md{font-size:1.15rem;font-weight:800;line-height:1.15}
.wkday small{opacity:.65;font-size:.7rem;font-weight:600}
.wkbye{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.wkbye-none{font-size:.88rem;font-weight:700;opacity:.85;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.wkbye-l{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.wkbye-t{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;width:100%;max-width:calc(var(--n,4) * 110px)}
.wkbt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);min-width:0}
.wkbt .logo{width:30px;height:30px}
.wkbt span{font-size:.7rem;font-weight:700;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkhero-ctl{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.wkhero-ctl label{color:inherit;display:flex;align-items:center;gap:6px;font-size:.85rem;opacity:.9}
.wkhero-ctl select{margin:0;background:rgba(255,255,255,.1);color:var(--board-ink);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:5px 8px;font:inherit;font-weight:600;max-width:46vw}
.wkhero-ctl select option{color:#111;background:#fff}
@media (max-width:480px){.wkhero-ctl{gap:8px}.wkhero-ctl label{font-size:.8rem}}
.note{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:12px 14px;border-radius:6px}
.note.warn{border-left-color:var(--pick)}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.roster{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px;margin:2px auto 6px;width:100%;max-width:calc(var(--n,6) * 130px)}
@media (max-width:420px){.roster{gap:3px}.rp{padding:7px 0 6px;border-radius:12px}.rav{width:38px;height:38px;font-size:.8rem}.rname{font-size:.7rem;letter-spacing:-.02em}.rsub{font-size:.58rem}}
.rp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.rp:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.rav{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.88rem;letter-spacing:.02em;background:color-mix(in srgb,var(--ink) 9%,var(--surface));box-shadow:0 0 0 3px var(--line)}
.rp.all .rav{box-shadow:0 0 0 3px var(--win)}
.rp.some .rav{box-shadow:none;outline:3px dashed #f2c94c;outline-offset:0}
.rme{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.55rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:1px 5px;border-radius:999px}
.rname{font-weight:700;font-size:.82rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.rsub{font-size:.66rem;opacity:.6;white-space:nowrap}
.rp.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.rp.sel .rav{background:rgba(255,255,255,.25)}.rp.sel .rsub{opacity:.8}
.rp.sel .rme{background:var(--accent-ink);color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.pill[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dot.in{background:var(--win)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card>h3,.game>header{background:var(--sunk);padding:8px 12px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.when{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted)}
.logo{width:1.25em;height:1.25em;object-fit:contain;flex:none;display:inline-block;vertical-align:middle}
.team{display:inline-flex;align-items:center;gap:.35em}
.game>header{flex-direction:column;align-items:flex-start;gap:2px}
.sidebet{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sidebet:last-of-type{border-bottom:0}
.sb-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sb-legs{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.sb-legs li{padding:1px 6px}
.sb-legs li.chosen{background:var(--pick);color:var(--pick-ink);font-weight:600;border-radius:4px}
.pend-tag{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--board);color:var(--board-ink);border-radius:4px;padding:1px 5px;margin-top:2px}
.parlay-res{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.matchup{display:flex;align-items:center;gap:.3em;flex-wrap:wrap;min-width:0}
.matchup .team{white-space:nowrap}
.matchup .vs{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted)}
.opt .logo{width:1.15em;height:1.15em}
.opt .team{gap:.3em}
/* Logo and line always sit side by side on one line; a line too long for its cell is shrunk to fit (see fitLabels). */
.opt .tw{display:inline-flex;flex-wrap:nowrap;align-items:center;white-space:nowrap;max-width:none}
.opt .nw{white-space:nowrap}

.score{background:var(--board);color:var(--board-ink);font-weight:700;text-align:center;padding:6px 10px}

  const tv=!gscore(g,true)&&S.season==='cur'&&S.tv&&S.tv[g.away+'|'+g.home];
  return '<span class="when"><span>'+esc(kickText(g))+'</span><span class="wdate">'+esc(chi(g.kick,{month:'short',day:'numeric'}))+'</span>'+(tv?'<span class="tvch" title="TV">'+esc(tv)+'</span>':'')+'</span>';

function parseOdds(list){

  const all=list.filter(x=>x&&x.commence_time&&x.home_team&&x.away_team).sort((a,b)=>new Date(a.commence_time)-new Date(b.commence_time));
  if(!all.length)throw new Error('No games found in the pasted data.');

// Reads the Odds API "scores" response and returns score updates for the games on this week's board.

// The days a week's games are played, e.g. [{d:'Thu',md:'Nov 19',n:1},{d:'Sun',md:'Nov 22',n:13},{d:'Mon',md:'Nov 23',n:1}].
function weekDays(week){
  const out=[];Object.values(week.games||{}).map(g=>g.kick).filter(Boolean).sort().forEach(k=>{
    const key=ctDay(k),last=out[out.length-1];
    if(last&&last.key===key)last.n++;else out.push({key,d:chi(k,{weekday:'short'}),md:chi(k,{month:'short',day:'numeric'}),n:1});
  });return out;
}
// Turns a saved label like "Nov 12, 15, 16 | 2026" into day chips (Thu Nov 12, Sun Nov 15, Mon Nov 16).
function labelDays(label){
  // Tidy older spellings: "2022/2023" (use the later year), "Jan 7/8" or "Jan 2-3" (two days), "Nov, 13" (stray comma).
  const L=String(label||'').replace(/(\d{4})\s*\/\s*(\d{4})/,'$2').replace(/(\d)\s*[-\/]\s*(?=\d)/g,'$1, ').replace(/^([A-Za-z]{3,})\.?\s*,\s*/,'$1 ');
  const m=L.match(/^(.*?)\s*\|\s*(\d{4})\s*$/);if(!m)return null;
  // "Oct/Nov 29, 1, 2": days use the first month until the numbers start over, then the second month.
  const two=m[1].match(/^([A-Za-z]{3})[a-z]*\.?\s*\/\s*([A-Za-z]{3})[a-z]*\.?\s+(.+)$/);
  if(two){let cur=two[1],prev=0;m[1]=two[3].split(',').map(x=>{const d=Number(x.trim());if(prev&&d<prev)cur=two[2];prev=d;return cur+' '+x.trim();}).join(', ');}
  const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let mon=null;const raw=[];
  for(const part of m[1].split(',')){
    const p=part.trim().match(/^(?:([A-Za-z]{3})[a-z]*\.?\s+)?(\d{1,2})$/);if(!p)return null;
    if(p[1])mon=MO.findIndex(x=>x.toLowerCase()===p[1].slice(0,3).toLowerCase());if(mon==null||mon<0)return null;
    raw.push([mon,Number(p[2])]);
  }
  // A week that runs Dec into Jan: the December days belong to the year before the label's year.
  const wraps=raw.some((x,i)=>i&&x[0]<raw[i-1][0]);let yr=Number(m[2])-(wraps?1:0);
  return raw.length?raw.map((x,i)=>{if(i&&x[0]<raw[i-1][0])yr++;const d=new Date(yr,x[0],x[1]);return {d:DW[d.getDay()],md:MO[x[0]]+' '+x[1]};}):null;
}

const aWname=(w,n)=>w.round||('Week '+n);
const aShort=(w,n)=>w.round?(ROUND_SHORT[w.round]||w.round):'Wk '+n;
function aNums(A){return Object.keys(A.weeks).map(Number).sort((a,b)=>a-b);}
function aScore(txt){const m=String(txt||'').match(/^(?:Final|Live)\s*:\s*(\d+)\s*-\s*(\d+)/i);return m?[Number(m[1]),Number(m[2])]:null;}
function aTeamOf(opt){const t=String(opt||'').trim().split(/\s+/).pop();return LOGOS[t]?t:'';}
// Grades one parlay leg written the way the sheets wrote them: "-1.5 Titans" or "Chargers vs Browns Under 47.5".
function aLeg(week,txt){
  const t=String(txt||'').replace(/\(.*?\)/g,'').trim();if(!t)return null;const low=t.toLowerCase();
  const ou=t.match(/(Over|Under)\s+(\d+(?:\.\d+)?)/i);
  for(const g of week.games){
    const sc=aScore(g[3]);if(!sc)continue;const away=g[0].toLowerCase(),home=g[1].toLowerCase();
    if(ou){if(low.includes(away)||low.includes(home)){const tot=sc[0]+sc[1],l=Number(ou[2]);return tot===l?'push':(/over/i.test(ou[1])?tot>l:tot<l);}continue;}
    const m=t.match(/^(PK|[+-]?\d+(?:\.\d+)?)\s+(.+)$/i);if(!m)return null;
    const team=m[2].trim().toLowerCase(),line=m[1].toUpperCase()==='PK'?0:Number(m[1]);
    if(team!==away&&team!==home)continue;
    const mine=team===away?sc[0]:sc[1],opp=team===away?sc[1]:sc[0];return mine+line===opp?'push':mine+line>opp;
  }
  return null;
}
const aPos=v=>v&&v!=='0'&&!String(v).startsWith('-');
function aResCell(v){if(v==null||v==='')return '<div class="res none">.</div>';return '<div class="res '+(aPos(v)?'win':'miss')+'">'+esc(v)+'</div>';}
function aStandings(A){
  const g=new Set(A.guests||[]),rows={},winners={};
  A.players.filter(p=>!g.has(p.key)).forEach(p=>{rows[p.key]={key:p.key,name:p.name,points:0,won:0,c:0,n:0,byWeek:{}};});
  aNums(A).forEach(n=>{
    const tot={};Object.keys(rows).forEach(k=>{const e=A.entries[k]&&A.entries[k][n];if(e&&e.t!=null){tot[k]=e.t;rows[k].points+=e.t;rows[k].byWeek[n]=e.t;rows[k].c+=e.n[0];rows[k].n+=e.n[1];}});
    const vals=Object.values(tot);if(!vals.length||A.weeks[n].done===false)return;const best=Math.max(...vals),w=Object.keys(tot).filter(k=>tot[k]===best);
    if(A.tie==='share'||w.length===1){winners[n]=w;w.forEach(k=>rows[k].won++);}else winners[n]=[];
  });
  if(A.futAdd&&A.fut)Object.keys(rows).forEach(k=>{rows[k].points+=A.fut.pts[k]||0;});
  const list=Object.values(rows).map(r=>Object.assign(r,{cpp:A.cpp&&A.cpp[r.key]!=null?A.cpp[r.key]:(r.n?r.c/r.n*100:null)}));
  list.sort((a,b)=>b.points-a.points||b.won-a.won||(b.cpp||0)-(a.cpp||0));
  return {list,winners};
}

const CROWN='<svg viewBox="0 0 64 44" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset=".5" stop-color="#d9b45a"/><stop offset="1" stop-color="#8a6a24"/></linearGradient></defs><path d="M4 14l14 11L32 4l14 21 14-11-5 24H9z" fill="url(#cg)" stroke="#5a4316" stroke-width="1.2" stroke-linejoin="round"/><rect x="9" y="38" width="46" height="5" rx="1.5" fill="url(#cg)"/><circle cx="4" cy="13" r="3" fill="#f6e3a1"/><circle cx="32" cy="4" r="3.2" fill="#f6e3a1"/><circle cx="60" cy="13" r="3" fill="#f6e3a1"/><circle cx="32" cy="29" r="3" fill="#7a1b2c" stroke="#f6e3a1" stroke-width="1"/></svg>';
// Everything the Hall of Fame shows, worked out from the past seasons and this season so far.
function hofData(){
  const people={},add=(k,name)=>people[k]=people[k]||{key:k,name,titles:[],points:0,won:0,seasons:0,parlays:0,c:0,n:0};
  const lows=[],pcts=[],champs=[],recs={week:null,seasonWon:null,seasonPts:null,margin:null,side:null};
  const better=(cur,val)=>!cur||val>cur.val;
  SEASONS.slice().sort((a,b)=>a.id.localeCompare(b.id)).forEach(A=>{
    const st=aStandings(A),g=new Set(A.guests||[]);
    st.list.forEach(r=>{const p=add(r.key,r.name);p.points+=r.points;p.won+=r.won;p.seasons++;p.c+=r.c;p.n+=r.n;
      if(better(recs.seasonWon,r.won))recs.seasonWon={val:r.won,who:r.name,when:A.id,sid:A.id};
      if(better(recs.seasonPts,r.points))recs.seasonPts={val:r.points,who:r.name,when:A.id,sid:A.id};});
    const top=st.list[0],second=st.list[1];
    if(top){people[top.key].titles.push(A.id);champs.push({yr:A.id,name:top.name,pts:top.points,by:second?top.points-second.points:null});
      if(second&&better(recs.margin,top.points-second.points))recs.margin={val:top.points-second.points,who:top.name,when:A.id,sid:A.id};}
    aNums(A).forEach(n=>A.players.forEach(p=>{
      if(g.has(p.key))return;const e=(A.entries[p.key]||{})[n];if(!e)return;
      if(e.t!=null&&better(recs.week,e.t))recs.week={val:e.t,who:p.name,when:A.id+', '+aWname(A.weeks[n],n),sid:A.id,n,key:p.key};
      if(e.t!=null&&!A.weeks[n].round&&A.weeks[n].done!==false&&!(e.note))lows.push({val:e.t,who:p.name,when:A.id+', '+aWname(A.weeks[n],n),ord:A.id+String(n).padStart(2,'0'),sid:A.id,n,key:p.key});
      if(!A.weeks[n].round&&A.weeks[n].done!==false&&!e.note&&e.n&&e.n[1])pcts.push({val:e.n[0]/e.n[1]*100,who:p.name,when:A.id+', '+aWname(A.weeks[n],n),ord:A.id+String(n).padStart(2,'0'),sid:A.id,n,key:p.key});
      if(e.par&&aPos(e.par.r))add(p.key,p.name).parlays++;
      (e.x||[]).forEach(x=>{const v=parseInt(x.r,10);if(v>0&&better(recs.side,v))recs.side={val:v,who:p.name,when:A.id+', '+aWname(A.weeks[n],n),what:x.h.replace(/\s*\(.*$/,'')};});
    }));
  });
  let live=null;
  if(S.cfg&&S.got.cfg){
    const cs=computeSeason(S.cfg,S.weeks,S.entries);
    cs.list.forEach(r=>{const p=add(r.key,r.name);p.points+=r.points;p.won+=r.won;p.seasons++;});
    cs.nums.forEach(n=>players().forEach(p=>{
      const w=subWeek(p.key,n);if(!w)return;const sc=scoreWeek(S.weeks[n],w,true),pp=add(p.key,p.name);
      if(!(w.manual&&w.manual.total!=null)){pp.c+=sc.correct;pp.n+=2*Object.values(S.weeks[n].games||{}).filter(g=>g.fin&&g.sa!=null&&g.sh!=null).length;}
      if(better(recs.week,sc.total))recs.week={val:sc.total,who:p.name,when:curSeasonLabel()+', '+wname(n),sid:'cur',n,key:p.key};
      if(!S.weeks[n].round&&weekComplete(S.weeks[n])&&!w.manual)lows.push({val:sc.total,who:p.name,when:curSeasonLabel()+', '+wname(n),ord:curSeasonLabel()+String(n).padStart(2,'0'),sid:'cur',n,key:p.key});
      if(!S.weeks[n].round&&weekComplete(S.weeks[n])&&!w.manual){const poss=2*Object.keys(S.weeks[n].games||{}).length;if(poss)pcts.push({val:sc.correct/poss*100,who:p.name,when:curSeasonLabel()+', '+wname(n),ord:curSeasonLabel()+String(n).padStart(2,'0'),sid:'cur',n,key:p.key});}
      if(sc.parlayState==='hit')add(p.key,p.name).parlays++;
    }));
    if(cs.list[0]&&cs.list[0].points>0)live={yr:curSeasonLabel(),name:cs.list[0].name,pts:cs.list[0].points};
  }
  if(lows.length){const m=Math.min(...lows.map(x=>x.val)),all=lows.filter(x=>x.val===m).sort((a,b)=>a.ord.localeCompare(b.ord));
    recs.low={val:m,who:[...new Set(all.map(x=>x.who))].join(', '),when:all.length===1?all[0].when:(all.length+' times, first in '+all[0].when),sid:all[0].sid,n:all[0].n,key:all[0].key};}
  // Ties name everyone who shares the record and link to the first time it happened.
  const pick=(arr,fn)=>{if(!arr.length)return null;const m=fn(...arr.map(x=>Math.round(x.val*100)/100)),all=arr.filter(x=>Math.round(x.val*100)/100===m).sort((a,b)=>a.ord.localeCompare(b.ord));
    return {val:m,who:[...new Set(all.map(x=>x.who))].join(', '),when:all.length===1?all[0].when:(all.length+' times, first in '+all[0].when),sid:all[0].sid,n:all[0].n,key:all[0].key};};
  recs.cppHi=pick(pcts,Math.max);recs.cppLo=pick(pcts,Math.min);
  return {people:Object.values(people),champs,recs,live};
}

// The anthem starts when the tab is opened (that click counts as permission to play), stops when you leave, and remembers if you paused it.
// Played through Web Audio with a "playback" audio session so it plays even with the phone on silent.
// Everything is shut down when you leave the tab or the page is hidden, which also clears it from the lock screen.
const HOF={ctx:null,buf:null,src:null,gain:null,loading:null,on:false};
function hofPlaying(){return HOF.on;}
function hofNoMusic(){S.hofNoMusic=true;hofStop();const t=document.getElementById('hof-toggle');if(t)t.remove();}
function hofLoad(ctx){
  if(HOF.buf)return Promise.resolve(HOF.buf);
  if(!HOF.loading)HOF.loading=fetch('hall-of-fame.mp3').then(r=>{if(!r.ok)throw new Error('missing');return r.arrayBuffer();})
    .then(ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej))).then(b=>(HOF.buf=b))
    .catch(e=>{HOF.loading=null;hofNoMusic();throw e;});
  return HOF.loading;
}
function hofPlay(force){
  if(S.hofNoMusic||HOF.on)return;if(!force&&ls.get('mlfl.hofmute')==='1')return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  let ctx;try{ctx=HOF.ctx=new AC();HOF.gain=ctx.createGain();HOF.gain.gain.value=.45;HOF.gain.connect(ctx.destination);if(ctx.resume)ctx.resume().catch(()=>{});}catch(e){return;}
  HOF.on=true;
  hofLoad(ctx).then(buf=>{
    if(!HOF.on||HOF.ctx!==ctx||HOF.src)return;
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.connect(HOF.gain);src.start();HOF.src=src;
  }).catch(()=>{}).finally(()=>setTimeout(hofMusicSync,0));
  setTimeout(hofMusicSync,0);
}
function hofStop(){
  HOF.on=false;
  if(HOF.src){try{HOF.src.stop();}catch(e){}HOF.src=null;}
  if(HOF.ctx){const c=HOF.ctx;HOF.ctx=null;HOF.gain=null;try{c.close().catch(()=>{});}catch(e){}}
  try{if(navigator.audioSession)navigator.audioSession.type='auto';}catch(e){}
  try{if(navigator.mediaSession){navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none';}}catch(e){}
}

/* ---------- Starting a new season ---------- */
// Turns the season being played into the same read-only form as the past seasons, so it can be browsed, ranked and counted in the Hall of Fame.
function snapshotSeason(){
  const cfg=S.cfg,id=curSeasonLabel(),nums=Object.keys(S.weeks).map(Number).sort((a,b)=>a-b),cs=computeSeason(cfg,S.weeks,S.entries);
  const weeks={},entries={};
  cfg.players.forEach(p=>{entries[p.key]={};});
  nums.forEach(n=>{
    const w=S.weeks[n],games=sortedGames(w),mult=weekMult(w);
    weeks[n]={round:w.round||'',label:w.label||weekLabel(w),done:weekComplete(w),games:games.map(([gid,g])=>{
      const fin=g.sa!=null&&g.sh!=null?(g.fin?'Final: ':'Live: ')+g.sa+' - '+g.sh+' ('+(g.sa>g.sh?g.away:g.sh>g.sa?g.home:'Tie')+')':'';
      return [g.away,g.home,kickText(g),fin,g.sp==null?'':spreadLabel(g,'away'),g.sp==null?'':spreadLabel(g,'home'),g.tot==null?'':ouLabel(g,'over'),g.tot==null?'':ouLabel(g,'under')];
    })};
    cfg.players.forEach(p=>{
      const sub=subWeek(p.key,n);if(!sub)return;
      const sc=scoreWeek(w,sub,true),cell=(x,picked)=>x===true?'+'+mult:(x===false||x==='push')?'0':(picked?'0':'');
      const pstr=games.map(([gid])=>{const x=(sub.p&&sub.p[gid])||{};return (x.s==='away'?'a':x.s==='home'?'h':'-')+(x.o==='over'?'o':x.o==='under'?'u':'-');}).join('');
      const cells=games.map(([gid])=>{const r=sc.per[gid]||{},x=(sub.p&&sub.p[gid])||{};return r.combo?'*+'+3*mult:cell(r.sw,!!x.s)+','+cell(r.ow,!!x.o);});
      const e={p:pstr,c:cells,t:sc.total,th:'Total Points ('+wname(n)+')',
        tl:['Spread Points: '+sc.spread+' | O/U Points: '+sc.ou,'Same Game Combo Points: '+sc.combo,'5 Game Parlay Points: '+sc.parlay,'Total Points: '+sc.total].concat(sc.pct!=null?['Correct Pick Percentage: '+sc.pct.toFixed(2)+'%']:[]),
        pct:sc.pct==null?null:Number(sc.pct.toFixed(2)),n:[sc.correct,2*games.length]};
      if(sub.manual&&sub.manual.note)e.note=sub.manual.note;
      if(sub.parlay&&sub.parlay.length)e.par={h:'5 Game Parlay Bonus (+20 Points)',l:sub.parlay.map(l=>legLabel(w,l.g+'|'+l.m+'|'+l.v,l.l)),r:sc.parlayState==='hit'?'+20':sc.parlayState==='miss'?'0':''};
      entries[p.key][n]=e;
    });
  });
  const fr=cfg.futuresResult||{},picks={},pts={};
  cfg.players.forEach(p=>{const f=S.entries[p.key]&&S.entries[p.key].futures;if(f&&f.at){picks[p.key]=[f.afc,f.nfc,f.sb];pts[p.key]=(fr.afc&&f.afc===fr.afc?10:0)+(fr.nfc&&f.nfc===fr.nfc?10:0)+(fr.sb&&f.sb===fr.sb?20:0);}});
  const cpp={};cs.list.forEach(r=>{if(r.cpp!=null)cpp[r.key]=Number(r.cpp.toFixed(2));});
  return {id,players:cfg.players.map(p=>({key:p.key,name:p.name,abbr:abbr(p)})),tie:'share',weeks,entries,cpp,notes:[],guests:[],futAdd:true,
    fut:Object.keys(picks).length?{h:'Future Picks (AFC +10 | NFC +10 | SB +20)',picks,pts,res:{afc:fr.afc||'',nfc:fr.nfc||'',sb:fr.sb||''}}:null};
}
async function ghPutFile(path,text,message){
  const url='https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+'/contents/'+path;
  let sha=null;try{const g=await fetch(url+'?t='+Date.now(),{headers:ghHdr(),cache:'no-store'});if(g.ok)sha=(await g.json()).sha;}catch(e){}
  const body={message,content:b64enc(text)};if(sha)body.sha=sha;
  const r=await fetch(url,{method:'PUT',headers:ghHdr(),body:JSON.stringify(body)});return r.ok;
}
// Seasons archived from this site live in seasons/<id>.json next to the page; data.json lists them.
async function loadArchived(){
  const ids=((S.cfg&&S.cfg.past)||[]).filter(id=>!SEASONS.some(x=>x.id===id));
  for(const id of ids){
    let A=null;
    try{const r=await fetch('seasons/'+encodeURIComponent(id)+'.json?t='+Date.now(),{cache:'no-store'});if(r.ok)A=await r.json();}catch(e){}
    if(!A&&GH.owner){try{const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+'/contents/seasons/'+encodeURIComponent(id)+'.json?t='+Date.now(),{headers:ghHdr(),cache:'no-store'});if(r.ok)A=JSON.parse(b64dec((await r.json()).content));}catch(e){}}
    if(A&&A.id&&!SEASONS.some(x=>x.id===A.id))SEASONS.push(A);
  }
  SEASONS.sort((a,b)=>b.id.localeCompare(a.id));
}
function slugKey(name,taken){let k=String(name).toLowerCase().replace(/[^a-z0-9]+/g,'')||'player';let base=k,i=2;while(taken.includes(k))k=base+(i++);return k;}

function viewFutures(){
  if(archSeason())return archFutures(archSeason());
  const fr=S.cfg.futuresResult||{},open=S.cfg.futuresOpen!==false;
  const anyRes=fr.afc||fr.nfc||fr.sb,allRes=fr.afc&&fr.nfc&&fr.sb;
  let h=pageHero({eyebrow:curSeasonLabel()+' Season',title:'Futures',pill:allRes?{t:'Final',c:'fin'}:open?{t:'Open',c:'prog'}:{t:'Locked',c:''},html:futHeroHtml(fr)});
  const pending=players().filter(p=>!(S.entries[p.key]&&S.entries[p.key].futures&&S.entries[p.key].futures.at));
  if(S.isOwner&&open&&pending.length){
    const sel=(id,label,list)=>'<label for="'+id+'">'+label+' <select id="'+id+'" data-f><option value="">Choose</option>'+list.map(t=>'<option>'+t+'</option>').join('')+'</select></label>';
    h+='<section class="dcard fform"><div class="thead">Enter future picks</div><div class="fsel"><label for="fu-who">Player <select id="fu-who" data-f>'+pending.map(p=>'<option value="'+esc(p.key)+'">'+esc(p.name)+'</option>').join('')+'</select></label>'+sel('fu-afc','AFC winner',AFC)+sel('fu-nfc','NFC winner',NFC)+sel('fu-sb','Super Bowl winner',AFC.concat(NFC).sort())+'</div><div class="dlg-bar"><button class="btn primary" data-act="futsubmit">Submit future picks</button></div><p class="dfoot">Future picks lock when you submit.</p></section>';
  }
  const sets=players().map(p=>{const f=S.entries[p.key]&&S.entries[p.key].futures;return f&&f.at?[f.afc,f.nfc,f.sb]:null;});
  const pts=f=>!f||!anyRes?null:(fr.afc&&f[0]===fr.afc?10:0)+(fr.nfc&&f[1]===fr.nfc?10:0)+(fr.sb&&f[2]===fr.sb?20:0);
  const cards=players().map((p,i)=>({p,f:sets[i],pts:pts(sets[i])}));
  if(anyRes)cards.sort((a,b)=>(b.pts||0)-(a.pts||0));
  if(sets.some(Boolean))h+=futPopular(sets);
  h+='<div class="fgrid">'+cards.map(x=>futCard(x.p.name,x.p.key,x.f,fr,x.pts,S.me)).join('')+'</div>';
  if(!open)h+='<p class="muted small">Future picks are closed.</p>';
  return h;
}

function collectDraft(n,k){
  const week=S.weeks[n],d=getDraft(n,k),sub=subWeek(k,n),pend=pendingFor(n,k),p={};let made=0,avail=0;
  sortedGames(week).forEach(([gid,g])=>{
    if(started(g))return;
    const l=Object.assign({},(sub&&sub.p&&sub.p[gid])||{},pend.p[gid]||{}),x=d.p[gid]||{},y={};
    if(g.sp!=null&&!l.s){avail++;if(x.s){y.s=x.s;made++;}}
    if(g.tot!=null&&!l.o){avail++;if(x.o){y.o=x.o;made++;}}
    if(y.s||y.o)p[gid]=y;
  });
  const nl=((sub&&sub.parlay&&sub.parlay.length)||0)+pend.legs.length,par=hasParlay(week)&&nl<5&&scoreWeek(week,sub,false).parlayState!=='miss';
  const legs=par?openLegs(week,sub,d,pend.legs).map(c=>{const [g,m,v]=c.split('|');return {g,m,v};}):[];
  return {p,legs,made,avail,par,nl};
}
function draftSummary(c){

    (c.par?'<div class="dtile'+(c.legs.length?' gold':'')+'"><b>'+(c.legs.length?'+'+c.legs.length:'0')+'</b><span>Parlay'+(tot?' · '+tot+'/5':'')+'</span></div>':'')+'</div>'+
    (c.made<c.avail?'<p class="dnote">The rest stay open until 30 minutes before the first game on their day. Monday games lock with Sunday.</p>':'')+
    (c.par&&tot&&tot<5?'<p class="dnote">Add the other parlay legs later.</p>':'');
}

  // Safety net: never stays up longer than the clip plus a little.
  EGG.t=setTimeout(eggEnd,7000);
  const AC=window.AudioContext||window.webkitAudioContext;
  const fallback=()=>{try{const a=new Audio(EGG_MP3);EGG.au=a;a.onended=eggEnd;a.play().catch(()=>{clearTimeout(EGG.t);EGG.t=setTimeout(eggEnd,4900);});}catch(e){clearTimeout(EGG.t);EGG.t=setTimeout(eggEnd,4900);}};
  if(!AC)return fallback();
  // Web Audio so it plays even with the phone on silent, like the Hall of Fame music.
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  let ctx;try{ctx=EGG.ctx=new AC();if(ctx.resume)ctx.resume().catch(()=>{});}catch(e){EGG.ctx=null;return fallback();}
  const go=buf=>{
    if(!EGG.busy||EGG.ctx!==ctx)return;
    const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.onended=eggEnd;src.start();EGG.src=src;
    clearTimeout(EGG.t);EGG.t=setTimeout(eggEnd,buf.duration*1000+1500);
  };
  if(EGG.buf)return go(EGG.buf);
  new Promise((res,rej)=>ctx.decodeAudioData(eggB64(EGG_MP3),res,rej)).then(b=>{EGG.buf=b;go(b);}).catch(()=>{if(EGG.ctx===ctx){EGG.ctx=null;try{ctx.close();}catch(e){}}fallback();});
}
document.addEventListener('click',ev=>{const m=ev.target.closest&&ev.target.closest('.mast .mk');if(m)eggPlay();});
window.addEventListener('hashchange',()=>{if(EGG.busy&&location.hash.replace('#','')!=='futures')eggEnd();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)eggEnd();});
</script>
