<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLFL Pick'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a scoreboard. Teal masthead, a wall of game cards that read like the sheet's blocks, results in a right-hand column. */
:root{
  --bg:#eef3f3; --surface:#ffffff; --sunk:#e3eaea; --ink:#0f2022; --muted:#586b6d; --line:#cdd8d8;
  --accent:#0d7f8a; --accent-ink:#ffffff; --board:#10282b; --board-ink:#f1f7f7;
  --gold:#b8860b; --silver:#6f777e; --bronze:#a0592a;
  --pick:#f7bd0a; --pick-ink:#1d1600; --win:#1b9550; --combo:#9447dc; --miss:#d7372b; --res-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1516; --surface:#152123; --sunk:#1c2b2d; --ink:#e7f0f0; --muted:#93a7a9; --line:#2b3d40;
    --accent:#3fc1cc; --accent-ink:#04191b; --board:#050b0c; --board-ink:#e7f0f0;
    --pick:#f2b705; --pick-ink:#1d1600; --win:#27a862; --combo:#a763ea; --miss:#e0483c; --res-ink:#ffffff;
    --gold:#f2c94c; --silver:#c9d0d6; --bronze:#e0995e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1516; --surface:#152123; --sunk:#1c2b2d; --ink:#e7f0f0; --muted:#93a7a9; --line:#2b3d40;
  --accent:#3fc1cc; --accent-ink:#04191b; --board:#050b0c; --board-ink:#e7f0f0;
  --pick:#f2b705; --pick-ink:#1d1600; --win:#27a862; --combo:#a763ea; --miss:#e0483c; --res-ink:#ffffff;
  --gold:#f2c94c; --silver:#c9d0d6; --bronze:#e0995e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.mast{background:var(--accent);color:var(--accent-ink)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-top:14px;padding-bottom:14px}
.mast h1{font-size:2rem;line-height:1;text-transform:uppercase}
.mast .sub{font-weight:600;opacity:.9}
.me{margin-left:auto;font-weight:600;background:rgba(0,0,0,.18);padding:4px 12px;border-radius:999px}
a{color:var(--accent)}
nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:20px 0 56px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.weekhead{font-size:1.9rem;line-height:1.05}
.note{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);padding:12px 14px;border-radius:6px}
.note.warn{border-left-color:var(--pick)}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dot.in{background:var(--win)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card>h3,.game>header{background:var(--sunk);padding:8px 12px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.when{font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted)}
.logo{width:1.25em;height:1.25em;object-fit:contain;flex:none;display:inline-block;vertical-align:middle}
.team{display:inline-flex;align-items:center;gap:.35em}
.game>header{flex-direction:column;align-items:flex-start;gap:2px}
.parlay-res{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.matchup{display:flex;align-items:center;gap:.3em;flex-wrap:wrap;min-width:0}
.matchup .team{white-space:nowrap}
.matchup .vs{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted)}
.opt .logo{width:1.15em;height:1.15em}
.opt .team{gap:.3em}
/* Logo and line always sit side by side on one line; a line too long for its cell is shrunk to fit (see fitLabels). */
.opt .tw{display:inline-flex;flex-wrap:nowrap;align-items:center;white-space:nowrap;max-width:none}
.opt .nw{white-space:nowrap}

.score{background:var(--board);color:var(--board-ink);font-weight:700;text-align:center;padding:6px 10px}
.score.pre{font-weight:500;opacity:.85}
.rows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 2.8rem;grid-template-rows:auto auto}
.opt{border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);padding:9px 6px 7px;text-align:center;font-weight:700;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
button.opt{cursor:pointer}
button.opt:hover{background:var(--sunk)}
.opt.picked,button.opt.picked:hover{background:var(--pick);color:var(--pick-ink)}
.opt.masked{color:var(--muted);font-weight:500;font-size:.85rem}
.who{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.who span{font-size:.68rem;font-weight:700;background:var(--sunk);color:var(--ink);border-radius:4px;padding:0 4px;line-height:1.4}
.opt.picked .who span{background:rgba(0,0,0,.16);color:var(--pick-ink)}
.who span.sel,.opt.picked .who span.sel{background:var(--board);color:var(--board-ink)}
.res{border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--res-ink)}
.res.none{color:transparent}
.res.win{background:var(--win)}.res.miss{background:var(--miss)}.res.combo{background:var(--combo);grid-row:1 / span 2;grid-column:3}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.pad{padding:12px}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legs li{display:flex;gap:8px;align-items:center;font-weight:600}
.legs select{flex:1;min-width:0}
.mark{width:1.5rem;height:1.5rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--res-ink);background:var(--line);flex:none}
.mark.win{background:var(--win)}.mark.miss{background:var(--miss)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;color:var(--res-ink);background:var(--muted)}
.badge.win{background:var(--win)}.badge.miss{background:var(--miss)}.badge.combo{background:var(--combo)}.badge.pick{background:var(--pick);color:var(--pick-ink)}
.totals{background:var(--board);color:var(--board-ink);padding:12px;text-align:center;font-weight:700;display:flex;flex-direction:column;gap:4px}
.totals .big{font-family:var(--display);font-size:1.8rem;line-height:1.1}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr.lead td{font-weight:700}
td.winner{background:var(--pick);color:var(--pick-ink);font-weight:700}
.rank{font-family:var(--display);font-size:1.3rem;color:var(--muted);white-space:nowrap}
.rank.r1{color:var(--gold)}.rank.r2{color:var(--silver)}.rank.r3{color:var(--bronze)}
.pb{color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--miss)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
td input[type=text]{width:8.5rem}td input[type=number]{width:4.6rem}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;font-weight:600}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{font-style:normal}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);color:var(--ink);border-radius:10px;max-width:440px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.dialog h2{font-size:1.5rem}
.dialog ul{margin:0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--board);color:var(--board-ink);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
@media (max-width:420px){.mast h1{font-size:1.6rem}.weekhead{font-size:1.5rem}}
</style>
</head>
<body>
<div class="mast"><div class="wrap"><h1>MLFL Pick'em</h1><span class="sub" id="season"></span><span class="me" id="me" hidden></span></div></div>
<nav><div class="wrap" id="nav"></div></nav>
<div class="wrap"><main id="view"><p class="muted">Loading the league…</p></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
/*LOGIC-START*/
const AFC=['Bills','Dolphins','Patriots','Jets','Ravens','Bengals','Browns','Steelers','Texans','Colts','Jaguars','Titans','Broncos','Chiefs','Raiders','Chargers'];
const NFC=['Cowboys','Giants','Eagles','Commanders','Bears','Lions','Packers','Vikings','Falcons','Panthers','Saints','Buccaneers','Cardinals','Rams','49ers','Seahawks'];
const TZ='America/Chicago';
function fmtLine(n){return n===0?'PK':(n>0?'+':'')+n;}
function spreadLabel(g,side){const l=side==='away'?-g.sp:g.sp;return fmtLine(l)+' '+(side==='away'?g.away:g.home);}
function ouLabel(g,v){return (v==='over'?'Over ':'Under ')+g.tot;}
function hasScore(g,finalOnly){return g.sa!=null&&g.sh!=null&&(!finalOnly||!!g.fin);}
function evalSpread(g,side,finalOnly){
  if(!side||g.sp==null||!hasScore(g,finalOnly))return null;
  const mine=side==='away'?g.sa:g.sh,opp=side==='away'?g.sh:g.sa,line=side==='away'?-g.sp:g.sp,adj=mine+line;
  return adj===opp?'push':adj>opp;
}
function evalOU(g,v,finalOnly){
  if(!v||g.tot==null||!hasScore(g,finalOnly))return null;
  const t=g.sa+g.sh;return t===g.tot?'push':(v==='over'?t>g.tot:t<g.tot);
}
// Same rules as the sheet: +1 per correct pick, +3 when both picks in a game hit, a push scores 0, parlay is +20 only if all five legs win.
function legGame(g,l){if(!g||l.l==null)return g;return Object.assign({},g,l.m==='s'?{sp:l.v==='home'?l.l:-l.l}:{tot:l.l});}
const ROUNDS=['Wild Card','Divisional','Conference Championships','Super Bowl'];
const ROUND_SHORT={'Wild Card':'WC','Divisional':'DIV','Conference Championships':'CONF','Super Bowl':'SB'};
// Postseason rounds score double (+2 per pick, +6 for both in a game). The parlay stays +20 and is only offered when a week has five or more games.
function weekMult(week){return week&&week.round?2:1;}
function hasParlay(week){return Object.keys((week&&week.games)||{}).length>=5;}
function scoreWeek(week,wk,finalOnly){
  const out={spread:0,ou:0,combo:0,parlay:0,parlayState:'none',total:0,correct:0,evaluated:0,per:{},legs:[],pct:null};
  const games=(week&&week.games)||{},picks=(wk&&wk.p)||{},mult=weekMult(week);out.mult=mult;
  for(const gid in games){
    const g=games[gid],p=picks[gid]||{},sw=evalSpread(g,p.s,finalOnly),ow=evalOU(g,p.o,finalOnly),combo=sw===true&&ow===true;
    if(combo){out.combo+=3*mult;out.evaluated+=2;out.correct+=2;}
    else{
      if(sw!==null){out.evaluated++;if(sw===true){out.spread+=mult;out.correct++;}}
      if(ow!==null){out.evaluated++;if(ow===true){out.ou+=mult;out.correct++;}}
    }
    out.per[gid]={sw,ow,combo};
  }
  const legs=hasParlay(week)?((wk&&wk.parlay)||[]):[];
  if(legs.length){
    let miss=false,wins=0;
    for(const l of legs){
      const g=legGame(games[l.g],l),r=!g?null:(l.m==='s'?evalSpread(g,l.v,finalOnly):evalOU(g,l.v,finalOnly));
      out.legs.push(r);if(r===false||r==='push')miss=true;else if(r===true)wins++;
    }
    if(miss)out.parlayState='miss';else if(legs.length===5&&wins===5){out.parlayState='hit';out.parlay=20;}else out.parlayState='pending';
  }
  out.total=out.spread+out.ou+out.combo+out.parlay;
  out.pct=out.evaluated?out.correct/out.evaluated*100:null;
  // A commissioner-entered result (a week with no picks on file, or a hand-awarded total) overrides the computed one.
  const man=wk&&wk.manual;
  if(man){if(man.total!=null){out.total=man.total;out.manualTotal=true;}if(man.pct!=null)out.pct=man.pct;}
  return out;
}
function weekComplete(w){const g=Object.values((w&&w.games)||{});return g.length>0&&g.every(x=>x.fin&&x.sa!=null&&x.sh!=null);}
function computeSeason(cfg,weeks,entries){
  const players=(cfg&&cfg.players)||[],rows={},winners={};
  players.forEach(p=>{const b=p.base||{};rows[p.key]={key:p.key,name:p.name,points:b.points||0,won:b.won||0,cppSum:(b.cpp||0)*(b.weeks||0),cppN:b.weeks||0,byWeek:{},fut:0};});
  const nums=Object.keys(weeks||{}).map(Number).sort((a,b)=>a-b);
  for(const n of nums){
    const w=weeks[n],tot={};let best=-1;
    for(const p of players){
      const wk=entries[p.key]&&entries[p.key].weeks&&entries[p.key].weeks[n];
      if(!wk||!wk.at)continue;
      const sc=scoreWeek(w,wk,true),r=rows[p.key];
      r.byWeek[n]=sc.total;r.points+=sc.total;if(sc.pct!=null){r.cppSum+=sc.pct;r.cppN++;}
      tot[p.key]=sc.total;if(sc.total>best)best=sc.total;
    }
    if(weekComplete(w)&&best>=0){winners[n]=Object.keys(tot).filter(k=>tot[k]===best);winners[n].forEach(k=>rows[k].won++);}
  }
  const fr=(cfg&&cfg.futuresResult)||{};
  players.forEach(p=>{
    const f=entries[p.key]&&entries[p.key].futures,r=rows[p.key];
    if(f&&f.at){if(fr.afc&&f.afc===fr.afc)r.fut+=10;if(fr.nfc&&f.nfc===fr.nfc)r.fut+=10;if(fr.sb&&f.sb===fr.sb)r.fut+=20;}
    r.points+=r.fut;r.cpp=r.cppN?r.cppSum/r.cppN:null;
  });
  const list=Object.values(rows).sort((a,b)=>b.points-a.points||b.won-a.won||(b.cpp||0)-(a.cpp||0));
  return {list,winners,nums};
}
function chi(iso,opts){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:TZ},opts)).format(new Date(iso));}
function kickTag(iso){
  if(!iso)return '';
  const d=chi(iso,{weekday:'short'}),h=Number(chi(iso,{hour:'numeric',hourCycle:'h23'}));
  if(d==='Thu')return 'TNF';if(d==='Mon')return 'MNF';if(d==='Sun'&&h<11)return 'INT';if(d==='Sun'&&h>=18)return 'SNF';return '';
}
function kickText(g){if(!g.kick)return g.tag||'';const t=kickTag(g.kick);return chi(g.kick,{weekday:'short',hour:'numeric',minute:'2-digit'})+(t?' · '+t:'');}
function mascot(full){return String(full).trim().split(' ').pop();}
// Reads the Odds API "odds" response the sheet used and keeps only the current NFL week (up to Tuesday 1 PM Central).
function parseOdds(list){
  if(!Array.isArray(list)||!list.length)throw new Error('That does not look like the lines data. Copy the whole page, starting with [ and ending with ].');
  const all=list.filter(x=>x&&x.commence_time&&x.home_team&&x.away_team).sort((a,b)=>new Date(a.commence_time)-new Date(b.commence_time));
  if(!all.length)throw new Error('No games found in the pasted data.');
  const first=new Date(all[0].commence_time);let d=(9-first.getUTCDay())%7;if(d===0)d=7;
  const cut=new Date(first);cut.setUTCDate(cut.getUTCDate()+d);cut.setUTCHours(18,0,0,0);
  const games={};
  all.filter(x=>new Date(x.commence_time)<cut).forEach((x,i)=>{
    let sp=null,tot=null;const bm=x.bookmakers&&x.bookmakers[0];
    if(bm){
      const s=(bm.markets||[]).find(m=>m.key==='spreads'),t=(bm.markets||[]).find(m=>m.key==='totals');
      const ho=s&&s.outcomes.find(o=>o.name===x.home_team);if(ho&&typeof ho.point==='number')sp=ho.point;
      const ov=t&&t.outcomes.find(o=>o.name==='Over');if(ov&&typeof ov.point==='number')tot=ov.point;
    }
    const id=String(x.id||('g'+i)).replace(/[^A-Za-z0-9]/g,'')||('g'+i);
    games[id]={o:i,away:mascot(x.away_team),home:mascot(x.home_team),awayFull:x.away_team,homeFull:x.home_team,apiId:x.id||'',kick:new Date(x.commence_time).toISOString(),sp,tot,sa:null,sh:null,fin:false};
  });
  return games;
}
// Reads the Odds API "scores" response and returns score updates for the games on this week's board.
function parseScores(list,games){
  if(!Array.isArray(list))throw new Error('That does not look like the scores data. Copy the whole page, starting with [ and ending with ].');
  const upd={};const lc=s=>String(s||'').toLowerCase();
  for(const gid in games){
    const g=games[gid];
    const m=list.find(x=>x&&((g.apiId&&x.id===g.apiId)||((lc(x.away_team).includes(lc(g.away))&&lc(x.home_team).includes(lc(g.home)))||(lc(x.away_team).includes(lc(g.home))&&lc(x.home_team).includes(lc(g.away))))));
    if(!m||!m.scores||m.scores.length<2)continue;
    const a=m.scores.find(s=>lc(s.name).includes(lc(g.away))),h=m.scores.find(s=>lc(s.name).includes(lc(g.home)));
    if(!a||!h)continue;
    const sa=parseInt(a.score,10),sh=parseInt(h.score,10);if(isNaN(sa)||isNaN(sh))continue;
    upd[gid]={sa,sh,fin:!!m.completed};
  }
  return upd;
}
function weekLabel(w){
  const ks=Object.values((w&&w.games)||{}).map(g=>g.kick).filter(Boolean).sort();
  if(!ks.length)return '';
  const seen=[];let lastM='';const parts=[];
  ks.forEach(k=>{const key=chi(k,{month:'short',day:'numeric'});if(seen.includes(key))return;seen.push(key);const [m,dd]=key.split(' ');parts.push(m===lastM?dd:key);lastM=m;});
  return parts.join(', ')+' | '+chi(ks[0],{year:'numeric'});
}
// Every pick is due by Sunday 5:00 AM Central. Games before that Sunday (Thursday night, for example) lock at their own kickoff.
const DEADLINE_HOUR=5;
function weekDeadline(week){
  const suns=Object.values((week&&week.games)||{}).map(g=>g.kick).filter(k=>k&&chi(k,{weekday:'short'})==='Sun').sort();
  if(!suns.length)return null;
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(suns[0])).split('-').map(Number);
  for(const off of [5,6]){ // Central is UTC-5 in daylight time and UTC-6 in standard time
    const t=Date.UTC(parts[0],parts[1]-1,parts[2],DEADLINE_HOUR+off);
    if(Number(chi(new Date(t).toISOString(),{hour:'numeric',hourCycle:'h23'}))===DEADLINE_HOUR)return t;
  }
  return null;
}
/* Pick codes: a player's whole card packed into one short string they can text to the commissioner. */
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function fnv(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function boardOrder(week){return Object.entries((week&&week.games)||{}).sort((a,b)=>(a[1].o||0)-(b[1].o||0));}
function boardHash(week){return fnv(boardOrder(week).map(([id,g])=>id+':'+g.sp+':'+g.tot).join('|'))%1024;}
const LEGOPT=[['s','away'],['s','home'],['o','over'],['o','under']];
function encodePicks(cfg,week,n,key,p,legs){
  const games=boardOrder(week),pi=cfg.players.findIndex(x=>x.key===key),f=[[1,4],[Number(n),32],[pi,16],[games.length,32]];
  games.forEach(([gid])=>{const x=(p&&p[gid])||{};f.push([(x.s==='away'?1:x.s==='home'?2:0)*3+(x.o==='over'?1:x.o==='under'?2:0),9]);});
  const lr=games.length*4+1;
  for(let i=0;i<5;i++){const l=(legs&&legs[i])||null;let v=0;if(l){const gi=games.findIndex(g=>g[0]===l.g),oi=LEGOPT.findIndex(o=>o[0]===l.m&&o[1]===l.v);v=1+gi*4+oi;}f.push([v,lr]);}
  f.push([boardHash(week),1024]);f.push([fnv(f.map(x=>x[0]).join(','))%1024,1024]);
  let v=0n;for(let i=f.length-1;i>=0;i--)v=v*BigInt(f[i][1])+BigInt(f[i][0]);
  let out='';do{out=B32[Number(v%32n)]+out;v/=32n;}while(v>0n);
  return out.replace(/(.{4})(?=.)/g,'$1-');
}
function decodePicks(cfg,weeks,code){
  const bad=()=>new Error('That code has a typo or is incomplete. Ask the player to copy it again.');
  const clean=String(code||'').toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V').replace(/[^0-9A-Z]/g,'');
  if(clean.length<8)throw bad();
  let v=0n;for(const ch of clean){const i=B32.indexOf(ch);if(i<0)throw bad();v=v*32n+BigInt(i);}
  const vals=[],take=r=>{const x=Number(v%BigInt(r));v/=BigInt(r);vals.push(x);return x;};
  if(take(4)!==1)throw bad();
  const n=take(32),pi=take(16),ng=take(32),week=weeks[n],player=cfg.players[pi];
  if(!player)throw bad();
  if(!week)throw new Error('That code is for Week '+n+', which has no board on this site.');
  const games=boardOrder(week);if(games.length!==ng)throw new Error('That code was made before the Week '+n+' board changed. Ask the player to make their picks again.');
  const p={};games.forEach(([gid])=>{const x=take(9),s=Math.floor(x/3),o=x%3,y={};if(s)y.s=s===1?'away':'home';if(o)y.o=o===1?'over':'under';if(y.s||y.o)p[gid]=y;});
  const legs=[];for(let i=0;i<5;i++){const x=take(ng*4+1);if(x){const gi=Math.floor((x-1)/4),o=LEGOPT[(x-1)%4];if(!games[gi])throw bad();legs.push({g:games[gi][0],m:o[0],v:o[1]});}}
  const bh=take(1024),sum=fnv(vals.join(','))%1024,cs=take(1024);
  if(cs!==sum||v!==0n)throw bad();
  if(bh!==boardHash(week))throw new Error('That code was made before the Week '+n+' lines changed. Ask the player to make their picks again.');
  return {n,key:player.key,p,parlay:legs};
}

/* League data lives in data.json in the same GitHub repository as this page. Everyone reads it; only the commissioner's token can write it. */
const GH={owner:'',repo:'',token:'',sha:null};
function detectRepo(){
  let saved=null;try{saved=JSON.parse(ls.get('mlfl.gh')||'null');}catch(e){}
  if(saved&&saved.owner&&saved.repo)return saved;
  const m=location.hostname.match(/^([^.]+)\.github\.io$/i);if(!m)return {owner:'',repo:''};
  const seg=location.pathname.split('/').filter(Boolean)[0];
  return {owner:m[1],repo:seg&&!/\.html?$/i.test(seg)?seg:m[1]+'.github.io'};
}
const ghApi=()=>'https://api.github.com/repos/'+encodeURIComponent(GH.owner)+'/'+encodeURIComponent(GH.repo)+'/contents/data.json';
const ghHdr=()=>Object.assign({Accept:'application/vnd.github+json'},GH.token?{Authorization:'Bearer '+GH.token}:{});
const b64enc=str=>{const b=new TextEncoder().encode(str);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o);};
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function loadData(){
  let data=null,missing=false;
  if(GH.owner&&GH.repo){
    try{
      const r=await fetch(ghApi()+'?t='+Date.now(),{headers:ghHdr(),cache:'no-store'});
      if(r.ok){const j=await r.json();GH.sha=j.sha;data=JSON.parse(b64dec(j.content));}
      else if(r.status===404)missing=true;
    }catch(e){}
  }
  if(!data&&!missing){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}}
  if(!data)data=clone(SEED);
  S.cfg=data.cfg||clone(SEED.cfg);S.weeks=data.weeks||{};S.entries=data.entries||{};
  S.got={cfg:true,weeks:true,entries:true};S.loadedAt=Date.now();
}
async function persist(){
  if(!GH.token){toast('Sign in on the Commissioner tab to save changes.');return false;}
  const body={message:'Update league data',content:b64enc(JSON.stringify({cfg:S.cfg,weeks:S.weeks,entries:S.entries},null,1))};
  const put=()=>{if(GH.sha)body.sha=GH.sha;else delete body.sha;return fetch(ghApi(),{method:'PUT',headers:ghHdr(),body:JSON.stringify(body)});};
  try{
    let r=await put();
    if(r.status===409||r.status===422){const g=await fetch(ghApi()+'?t='+Date.now(),{headers:ghHdr(),cache:'no-store'});GH.sha=g.ok?(await g.json()).sha:null;r=await put();}
    if(!r.ok){toast(r.status===401||r.status===403||r.status===404?'GitHub did not accept the token. Check that it has Contents read and write access to this repository.':'Could not save to GitHub (error '+r.status+'). Try again.');return false;}
    GH.sha=(await r.json()).content.sha;return true;
  }catch(e){toast('Could not reach GitHub. Check your connection and try again.');return false;}
}
async function saveEntry(key,mut){
  const prev=S.entries[key],cur=clone(prev);mut(cur);S.entries[key]=cur;

async function saveDoc(path,data){

  if(isCfg)S.cfg=data;else S.weeks[parts[1]]=data;

}

function countPicks(w){let c=0;Object.values((w&&w.p)||{}).forEach(x=>{if(x.s)c++;if(x.o)c++;});return c;}
// What this device last put into a pick code, so a player can still see their own locked picks before kickoff.
function getSent(n,k){try{return JSON.parse(ls.get('mlfl.sent.'+draftKey(n,k))||'{}')||{};}catch(e){return {};}}

function mergeWeek(e,n,p,legs){
  e.weeks=e.weeks||{};const cur=e.weeks[n]&&e.weeks[n].at?e.weeks[n]:{p:{},parlay:[]};
  Object.keys(p).forEach(g=>{cur.p[g]=cur.p[g]||{};['s','o'].forEach(m=>{if(p[g][m]&&!cur.p[g][m])cur.p[g][m]=p[g][m];});});
  if(!cur.parlay)cur.parlay=[];

  const now=new Date().toISOString();if(!cur.at)cur.at=now;cur.upd=now;e.weeks[n]=cur;
}
function claimCard(){

function whoChips(gid,m,v,n,sel,g,visible){

function gameCard(gid,g,n,sel,sub,draft,sent,sc,open,visible){
  const lock=(sub&&sub.p&&sub.p[gid])||{},dp=(draft&&draft.p[gid])||{},sp=(sent&&sent[gid])||{},canTap=open&&!started(g),show=visible(g);

function legLabel(week,code,own){

// Drops draft legs that are already locked or whose game has started, and packs the rest to the front.

  const inp=(gid,k,type,val,extra)=>'<input type="'+type+'" id="g-'+esc(gid)+'-'+k+'" data-f data-k="'+k+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+' aria-label="'+k+'">';

/* ---------- Actions ---------- */
async function oddsData(urlFn){
  const pasted=$('#paste').value.trim();if(pasted)return pasted;
  const key=(ls.get('mlfl.oddskey')||'').trim();if(!key){toast('Enter your Odds API key first.');return null;}
  try{const r=await fetch(urlFn(key));const t=await r.text();if(!r.ok){toast('The odds service answered with an error ('+r.status+'). Check the key.');return null;}return t;}
  catch(e){toast('This page could not reach the odds service. Use the links below and paste the result instead.');return null;}
}
function collectDraft(n,k){
  const week=S.weeks[n],d=getDraft(n,k),sub=subWeek(k,n),p={};let made=0,avail=0;
  sortedGames(week).forEach(([gid,g])=>{
    if(started(g))return;
    const l=(sub&&sub.p&&sub.p[gid])||{},x=d.p[gid]||{},y={};
    if(g.sp!=null&&!l.s){avail++;if(x.s){y.s=x.s;made++;}}
    if(g.tot!=null&&!l.o){avail++;if(x.o){y.o=x.o;made++;}}
    if(y.s||y.o)p[gid]=y;
  });
  const nl=(sub&&sub.parlay&&sub.parlay.length)||0,par=hasParlay(week)&&nl<5&&scoreWeek(week,sub,false).parlayState!=='miss';
  const legs=par?openLegs(week,sub,d).map(c=>{const [g,m,v]=c.split('|');return {g,m,v};}):[];
  return {p,legs,made,avail,par,nl};
}
function draftSummary(c){return '<ul><li>'+c.made+' of the '+c.avail+' open pick'+(c.avail===1?'':'s')+' made'+(c.made<c.avail?'. The rest stay open until kickoff or the Sunday 5 AM deadline.':'.')+'</li>'+(c.par?'<li>'+(c.legs.length?'Parlay: '+c.legs.length+' new leg'+(c.legs.length===1?'':'s')+', making '+(c.nl+c.legs.length)+' of 5.'+(c.nl+c.legs.length<5?' Add the rest later.':''):'Parlay: no new legs.'+(c.nl?' '+c.nl+' of 5 already in.':''))+'</li>':'')+'</ul>';}
function clearForm(prefix){Object.keys(S.form).forEach(k=>{if(k.startsWith(prefix))delete S.form[k];});}
const acts={
  async signin(){
    const owner=$('#gh-owner').value.trim(),repo=$('#gh-repo').value.trim(),token=$('#gh-token').value.trim();
    if(!owner||!repo||!token){toast('Fill in all three boxes.');return;}
    try{
      const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token}});
      if(!r.ok){toast('GitHub did not accept that. Check the username, repository name and token.');return;}
    }catch(e){toast('Could not reach GitHub. Check your connection and try again.');return;}
    GH.owner=owner;GH.repo=repo;GH.token=token;ls.set('mlfl.gh',JSON.stringify({owner,repo}));ls.set('mlfl.token',token);
    S.isOwner=true;clearForm('gh-');await loadData();toast('Signed in as commissioner.');requestRender(true);
  },
  signout(){ls.del('mlfl.token');GH.token='';S.isOwner=false;requestRender(true);},
  selp(el){S.selPlayer=el.dataset.k;ls.set('mlfl.sel',S.selPlayer);requestRender(true);},
  goweek(el){S.selWeek=Number(el.dataset.n);},
  async claim(el){
    const k=el.dataset.k,e=S.entries[k]||{};
    if(e.uid&&e.uid!==S.uid){toast('That name is already linked to another account. Ask the commissioner to unlink it.');return;}

    requestRender(true);
  },
  pick(el){
    const n=S.selWeek,d=getDraft(n,S.selPlayer),g=el.dataset.g,m=el.dataset.m,v=el.dataset.v;
    d.p[g]=d.p[g]||{};if(d.p[g][m]===v)delete d.p[g][m];else d.p[g][m]=v;
    keepDraft(n,S.selPlayer);requestRender(true);
  },
  submit(){
    const n=S.selWeek,k=S.selPlayer,c=collectDraft(n,k),legs=c.legs;

      const ok=await saveEntry(k,e=>mergeWeek(e,n,c.p,legs));
      if(ok){delete S.drafts[draftKey(n,k)];ls.del('mlfl.draft.'+draftKey(n,k));toast('Picks submitted and locked.');requestRender(true);}
    });
  },
  getcode(){
    const n=S.selWeek,k=S.selPlayer,c=collectDraft(n,k),legs=c.legs;
    if(!c.made&&!legs.length){toast('Make at least one new pick first.');return;}

    addSent(n,k,c.p);
    $('#modal').innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>Pick code for '+esc(pname(k))+', '+esc(wname(n))+'</h2>'+draftSummary(c)+'<label for="codeout">Your code</label><textarea id="codeout" readonly rows="2" style="font-size:1.05rem;font-weight:700;text-align:center;min-height:0">'+esc(code)+'</textarea><p>Text this code to the commissioner. Your picks are not in until the commissioner enters it. If you change a pick before then, get a new code.</p><div class="bar"><button class="btn primary" id="dlg-copy">Copy code</button><button class="btn" id="dlg-no">Done</button></div></div></div>';
    $('#dlg-no').onclick=()=>{$('#modal').innerHTML='';};
    $('#dlg-copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);toast('Code copied. Paste it into a text to the commissioner.');}catch(e){$('#codeout').focus();$('#codeout').select();toast('Press and hold the code to copy it.');}};
    $('#dlg-copy').focus();
  },
  loadcode(){
    let d;try{d=decodePicks(S.cfg,S.weeks,$('#pcode').value);}catch(e){toast(e.message);return;}
    const week=S.weeks[d.n],cur=subWeek(d.key,d.n);
    if(week.open===false){toast('Picks are closed for '+wname(d.n)+'. Reopen them first if you want to add this.');return;}
    const p={},lateP={};let made=0,late=0,dup=0;
    Object.keys(d.p).forEach(gid=>['s','o'].forEach(m=>{
      if(!d.p[gid][m])return;
      if(cur&&cur.p&&cur.p[gid]&&cur.p[gid][m]){dup++;return;}
      const g=week.games[gid];
      if(kicked(g)||pastDeadline(g)){(lateP[gid]=lateP[gid]||{})[m]=d.p[gid][m];late++;return;}
      (p[gid]=p[gid]||{})[m]=d.p[gid][m];made++;
    }));
    const have=(cur&&cur.parlay)||[],dead=scoreWeek(week,cur,false).parlayState==='miss',legs=[],lateLegs=[];let legSkip=0;
    d.parlay.forEach(l=>{
      const g=week.games[l.g];
      if(!hasParlay(week)||dead||have.length+legs.length+lateLegs.length>=5||have.concat(legs,lateLegs).some(x=>x.g===l.g&&x.m===l.m)){legSkip++;return;}
      if(kicked(g)||pastDeadline(g))lateLegs.push(l);else legs.push(l);
    });
    const anyLate=late+lateLegs.length;
    if(!made&&!legs.length&&!anyLate){toast('Nothing new in that code for '+pname(d.key)+'. It is already locked in'+(legSkip?', or the parlay is full or over.':'.'));return;}
    const body='<ul><li>'+made+' new pick'+(made===1?'':'s')+(legs.length?' and '+legs.length+' new parlay leg'+(legs.length===1?'':'s')+', making '+(have.length+legs.length)+' of 5':'')+'.</li>'+(dup?'<li>'+dup+' already locked in and left unchanged.</li>':'')+(legSkip?'<li>'+legSkip+' parlay leg'+(legSkip===1?'':'s')+' left out (already in, or the parlay is full or over).</li>':'')+'</ul>'+
      (anyLate?'<p><strong>'+late+' pick'+(late===1?'':'s')+(lateLegs.length?' and '+lateLegs.length+' parlay leg'+(lateLegs.length===1?'':'s'):'')+' in this code '+(anyLate===1?'is':'are')+' past the deadline or kickoff.</strong> '+(anyLate===1?'It is':'They are')+' left out unless you tick the box.</p><label for="dlg-check"><input type="checkbox" id="dlg-check"> Include '+(anyLate===1?'it':'them')+'. The code reached me in time.</label>':'');
    confirmBox('Enter '+wname(d.n)+' picks for '+pname(d.key)+'?',body,'Submit and lock',async incl=>{
      const allP=clone(p),allLegs=legs.slice();
      if(incl){Object.keys(lateP).forEach(g=>{allP[g]=Object.assign(allP[g]||{},lateP[g]);});lateLegs.forEach(l=>allLegs.push(l));}
      if(!Object.keys(allP).length&&!allLegs.length){toast('Nothing was added.');return;}
      const ok=await saveEntry(d.key,e=>mergeWeek(e,d.n,allP,allLegs));
      if(ok){clearForm('pcode');toast(pname(d.key)+"'s "+wname(d.n)+' picks are in.');requestRender(true);}
    });
  },
  futsubmit(){
    const f={afc:$('#fu-afc').value,nfc:$('#fu-nfc').value,sb:$('#fu-sb').value};
    if(!f.afc||!f.nfc||!f.sb){toast('Choose all three before you submit.');return;}
    const who=$('#fu-who').value;
    confirmBox('Submit future picks for '+pname(who)+'?','<ul><li>AFC winner: '+esc(f.afc)+'</li><li>NFC winner: '+esc(f.nfc)+'</li><li>Super Bowl winner: '+esc(f.sb)+'</li></ul><p>These lock when you submit.</p>','Submit and lock',async()=>{
      f.at=new Date().toISOString();if(await saveEntry(who,e=>{e.futures=f;})){clearForm('fu-');toast('Future picks submitted.');requestRender(true);}
    });
  },
  async setcurrent(){await saveDoc('league/config',Object.assign(clone(S.cfg),{currentWeek:S.adminWeek}));},
  async newweek(){

  },

  addrow(){S.newRows.push('m'+Date.now().toString(36));requestRender(true);},

  async saveboard(){
    const n=S.adminWeek,week=clone(S.weeks[n]),old=week.games||{},games={};let o=0,bad=false;

      const gid=tr.dataset.gid,f=k=>tr.querySelector('[data-k="'+k+'"]'),num=k=>{const v=f(k).value.trim();if(v==='')return null;const x=Number(v);if(isNaN(x)){bad=true;return null;}return x;};
      const away=f('away').value.trim(),home=f('home').value.trim();if(!away||!home)return;
      const g=Object.assign({},old[gid],{o:o++,away,home,sp:num('sp'),tot:num('tot'),kick:f('kick').value?new Date(f('kick').value).toISOString():'',sa:num('sa'),sh:num('sh')});

  }

  if(el.id==='weektype'){const w=clone(S.weeks[S.adminWeek]);w.round=el.value;saveDoc('weeks/'+S.adminWeek,w).then(ok=>{if(ok)toast(el.value?'Set to '+el.value+': double points.':'Set to regular season.');requestRender(true);});return;}
  if(el.id==='adminweek'){S.adminWeek=Number(el.value);clearForm('g-');S.newRows=[];S.delRows={};requestRender(true);return;}
  if(el.dataset&&el.dataset.act==='leg'){const n=S.selWeek,k=S.selPlayer,d=getDraft(n,k),cur=openLegs(S.weeks[n],subWeek(k,n),d);while(cur.length<5)cur.push('');cur[Number(el.dataset.i)]=el.value;d.parlay=cur;keepDraft(n,k);requestRender(true);}
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='oddskey'){ls.set('mlfl.oddskey',el.value.trim());$('#lnk-odds').href=oddsUrl(el.value.trim());$('#lnk-scores').href=scoresUrl(el.value.trim());return;}
  if(el.dataset&&'f' in el.dataset&&el.id)S.form[el.id]=el.type==='checkbox'?el.checked:el.value;
});
function route(){const v=location.hash.replace('#','');S.view=['picks','standings','futures','commish'].includes(v)?v:'picks';requestRender(true);window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
// Tabs switch on the click itself, so they also work where the page cannot change its own address (file previews).
document.addEventListener('click',ev=>{
  const a=ev.target.closest('a[href^="#"]');if(!a)return;
  const v=a.getAttribute('href').slice(1);if(!['picks','standings','futures','commish'].includes(v))return;
  ev.preventDefault();S.view=v;requestRender(true);window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+v);}catch(e){}
});

async function init(){
  S.view=['picks','standings','futures','commish'].includes(location.hash.replace('#',''))?location.hash.replace('#',''):'picks';
  render();
  Object.assign(GH,detectRepo());GH.token=ls.get('mlfl.token')||'';S.isOwner=!!GH.token;
  await loadData();requestRender(true);
  // Viewers pick up new picks and scores when they come back to the tab.
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!S.isOwner&&Date.now()-S.loadedAt>60000){await loadData();requestRender();}});
}
init();
</script>
</body>
</html>
